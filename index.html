---
layout: index
---

<div class="home">
  <div class="row">
    {% for post in site.posts limit:6 %}
      <div class="col-12 article-abstract">
        <a href="{{ post.url | prepend: site.baseurl }}" class="text-decoration-none"><h2>{{ post.title }}</h2></a>
        <p class="blogdate">{{ post.date | date: "%d %B %Y" }}</p>
        <div>{{ post.content | split:'<!--break-->' | first }}</div>
      </div>
      <hr>
    {% endfor %}
  </div>
</div>
